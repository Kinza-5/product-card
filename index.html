<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="card">
      <div class="leftside">
        <img src="./pink shoes.png.png" alt="shoes">
        <div class="arrow">
                <i class="fa-solid fa-arrow-right-long"></i>
                <i class="fa-solid fa-arrow-left-long"></i>
            </div>
        </div>

        <div class="rightside">
            <h1 class="h1">Aramix</h1>
            <div class="icons">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-cart-shopping"></i>
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="h2">
                <h2>Wedding's Collections</h2>
            </div>
            <div class="men">
                <h3>Women's Party Wear Heels</h3>
            </div>
            
            <div class="money"><strong>$150</strong>&nbsp;&nbsp;&nbsp;&nbsp;<del>$200</del></div>
            <div class="size">Size&nbsp;&nbsp;&nbsp;
                7&nbsp;&nbsp;&nbsp;8&nbsp;&nbsp;&nbsp;10&nbsp;&nbsp;&nbsp;11&nbsp;&nbsp;&nbsp;
            </div>

            <div class="color">Colors
                <div class="green"></div>
                <div class="yellow"></div>
                <div class="blue"></div>
            </div>

            <div class="option">
                <div class="cart"><i class="fa-solid fa-cart-shopping"></i>&nbsp;&nbsp;</i>Add to cart</div>
                <div class="buy"><i class="fa-solid fa-cart-flatbed-suitcase"></i>&nbsp;&nbsp;Click to buy</div>
            </div>

    

    .
        </div>
       



    </div>

</body>

</html>
</div>
</body>

</html>
